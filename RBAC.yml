apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: <USER_NAMESPACE>
  name: lab-user-role
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-user-binding
  namespace: <USER_NAMESPACE>
subjects:
  - kind: User
    name: <USER_EMAIL>
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: lab-user-role
  apiGroup: rbac.authorization.k8s.io

